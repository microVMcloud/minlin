# Programs for init to start once the disk is mounted as /.
# Each line is "<action> <absolute path> [args...]", run in order:
#   wait     run it and wait for it to exit before going on
#   once     start it and leave it running
#   respawn  start it, and start it again whenever it exits
# When nothing is left running, init syncs the disk and reboots (which ends
# the VM).
#
# dropbear stays in the foreground (-F), logs to the console (-E), allows
# no password logins (-s), skips the motd (-m) and uses only the ed25519
# host key (-r). To shut the VM down cleanly (killing the VM can lose writes
# not yet synced to the disk), stop the listener from a session with
#   kill $(cat /var/run/dropbear.pid)
# and log out: once the last session ends, init syncs and reboots.

once /usr/sbin/dropbear -F -E -s -m -r /etc/dropbear/dropbear_ed25519_host_key

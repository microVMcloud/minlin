# Redis settings for minlin. install.sh appends requirepass and maxmemory.
# Anything not set here is Redis's default.

# Clients reach the guest from outside, through QEMU's port forward or the
# Firecracker bridge. protected-mode stays on: with a password set, it
# doesn't refuse them.
bind 0.0.0.0
port 6379
protected-mode yes

# init needs the server in the foreground, and the console is the log.
daemonize no
logfile ""

# The disk persists across boots, until the next build-disk.sh. With the
# append-only file fsynced every second, a killed VM (which skips init's
# final sync) loses at most about a second of writes. Redis 7+ keeps it as
# a manifest and files in appenddirname under dir.
dir /var/lib/redis
appendonly yes
appendfsync everysec

# Without a limit, writes past what the guest has get Redis killed for want of
# memory and lose the data since the last fsync. noeviction fails those writes
# with an error instead, as a database should; set maxmemory-policy
# allkeys-lru to use it as a cache.
maxmemory-policy noeviction

# Reverse proxy in front of lightpanda's MCP server. lightpanda only answers
# requests whose Host is an IP address or localhost (against DNS rebinding),
# so behind a proxy that keeps the public name, such as microVM Cloud's, it
# refuses everything. lighttpd listens on port 80 instead, turns away
# requests without the bearer token, and passes the rest to lightpanda on
# 127.0.0.1:9222 with Host rewritten to 127.0.0.1. (lightpanda 1.1.0 refuses
# a bare "localhost", though it takes "localhost:<port>".)
#
# Runs in the foreground (-D) as root. Errors go to stderr, which is the
# serial console. There's no access log: lightpanda logs each navigation.

server.port        = 80
# Required, but every request goes to the proxy; install.sh creates it empty.
server.document-root = "/var/empty"
server.modules     = ( "mod_access", "mod_proxy" )
server.upload-dirs = ( "/tmp" )
# Pass responses on as lightpanda writes them, so event streams aren't held
# back until they end.
server.stream-response-body = 2

# Sets var.mcp_token, written by install.sh.
include "token.conf"

$REQUEST_HEADER["Authorization"] != "Bearer " + var.mcp_token {
    url.access-deny = ( "" )
}

proxy.server = ( "" => ( ( "host" => "127.0.0.1", "port" => 9222 ) ) )
proxy.header = ( "map-host-request" => ( "-" => "127.0.0.1" ) )

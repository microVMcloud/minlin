# Programs for init to start once the disk is mounted as /.
# Each line is "<action> <absolute path> [args...]", run in order:
#   wait     run it and wait for it to exit before going on
#   once     start it and leave it running
#   respawn  start it, and start it again whenever it exits
# When nothing is left running, init syncs the disk and reboots (which ends
# the VM).
#
# The disk is built with every file owned by root, and postgres refuses both
# to run as root and to use a data directory it doesn't own. So hand the data
# directory to the postgres user first, then start postgres as that user.
#
# postgres runs as "once": when the postmaster exits, init syncs the disk and
# reboots. On a shutdown signal init sends it SIGTERM, which postgres takes as
# a smart shutdown, and it writes a checkpoint before exiting. Its log goes to
# the console.

wait /usr/bin/chown -R postgres:postgres /var/lib/postgresql
once /usr/bin/setpriv --reuid=postgres --regid=postgres --clear-groups /usr/local/bin/postgres -D /var/lib/postgresql/data

# Minimal lighttpd config for minlin. Runs in the foreground (-D) as root:
# the kernel is built without CONFIG_MULTIUSER, so there are no other users
# to drop privileges to. Errors go to stderr, which is the serial console.

server.document-root = "/var/www"
server.port          = 80
server.modules       = ( "mod_accesslog", "mod_status" )
server.upload-dirs   = ( "/tmp" )

accesslog.filename = "/dev/stderr"
index-file.names   = ( "index.html" )
status.status-url  = "/server-status"

mimetype.assign = (
    ".html" => "text/html; charset=utf-8",
    ".css"  => "text/css; charset=utf-8",
    ".js"   => "text/javascript; charset=utf-8",
    ".txt"  => "text/plain; charset=utf-8",
    ".json" => "application/json",
    ".png"  => "image/png",
    ".jpg"  => "image/jpeg",
    ".svg"  => "image/svg+xml",
    ""      => "application/octet-stream",
)
